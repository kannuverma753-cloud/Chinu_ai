      - name: Add the app screens (chinu-ui.html)
        run: |
          UI=$(ls chinu-ui.html */chinu-ui.html 2>/dev/null | head -1)
          if [ -z "$UI" ]; then echo "::error::chinu-ui.html not found — upload it to the repo root"; exit 1; fi
          mkdir -p chinu/app/src/main/assets/www
          cp "$UI" chinu/app/src/main/assets/www/index.html
          cp "$UI" chinu-ui.html 2>/dev/null || true
          ls -la chinu/app/src/main/assets/www

      - name: Birthday photos & song (optional bday/ folder or bday.zip)
        run: |
          if [ -f bday.zip ]; then mkdir -p bday && unzip -o -j -q bday.zip -d bday || true; fi
          if [ -d bday ]; then
            mkdir -p chinu/app/src/main/assets/bday
            find bday -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.mp4' -o -iname '*.3gp' -o -iname '*.webm' -o -iname '*.mov' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.aac' -o -iname '*.ogg' -o -iname '*.wav' \) -exec cp {} chinu/app/src/main/assets/bday/ \;
          fi

      - name: Offline "Hey Chinu" engine (36 MB voice model)
        run: |
          curl -fsSL --retry 4 --retry-delay 5 -o /tmp/vmodel.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          rm -rf /tmp/vmodel && mkdir -p /tmp/vmodel && unzip -q /tmp/vmodel.zip -d /tmp/vmodel
          mkdir -p chinu/app/src/main/assets/model-en-in
          cp -r /tmp/vmodel/*/* chinu/app/src/main/assets/model-en-in/
          echo 'chinu-en-in-0.4' > chinu/app/src/main/assets/model-en-in/uuid

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: chinu
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../Chinu.apk

      - name: Save error log (only if build failed)
        if: failure()
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" build.log | head -40 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done || true
          git config user.name "chinu-bot"
          git config user.email "chinu-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git reset -q
          git add -f build.log
          git commit -q -m "build log #${{ github.run_number }}"
          git push -f origin build-log

      - uses: actions/upload-artifact@v4
        with:
          name: Chinu-apk
          path: Chinu.apk

      - name: Publish download link + auto-update (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.${{ github.run_number }}
          name: Chinu v5.${{ github.run_number }}
          make_latest: true
          body: |
            💖 Chinu v5.${{ github.run_number }} — download Chinu.apk below and install (it updates over the old app, nothing is deleted).
            native:${{ env.CHINU_NATIVE }}
          files: |
            Chinu.apk
            chinu-ui.html
