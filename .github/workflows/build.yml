# Chinu v5 — this ONE file builds the whole Android app (APK) on GitHub.
# Put it in your repo as:  .github/workflows/build.yml
# Put chinu-ui.html in the repo ROOT (next to README). That file is the app's look & features.
#   • Change only chinu-ui.html  → both phones update by themselves (no new APK, no uninstall)
#   • Change this build.yml      → a new APK; it installs straight over the old one (same signing key)
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

